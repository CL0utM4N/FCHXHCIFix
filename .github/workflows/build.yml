name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MacKernelSDK
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: FCHXHCIFix
          path: build/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "FCHXHCIFix ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --verify-tag
